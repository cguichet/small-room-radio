name: Find songs

on:
  schedule:
    - cron: "17 9 * * *"   # every day at 1:17am Pacific, just after YouTube's quota resets
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  find-songs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Look up today's batch of bands
        run: python3 build_tracks.py "${{ secrets.YOUTUBE_API_KEY }}"
      - name: Save tracks.json to the site
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tracks.json
          git diff --cached --quiet || git commit -m "Add songs"
          git push
